[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pollofpolls"
version = "2026.0.0"
description = "NZ Poll of Polls: Bayesian state-space poll aggregation and seat forecast for the 2026 New Zealand general election"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "polars>=1.0",
    "pyarrow>=15",
    "jax[cpu]>=0.4.30",
    "numpyro>=0.15",
    "requests>=2.31",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.4"]

[project.scripts]
pollofpolls = "pollofpolls.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pollofpolls = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
