# Election calendar and party configuration.
# pm_party = party of the Prime Minister going into that election (used by the fundamentals prior).
# forecast: true marks the election being forecast (exactly one). Polls are read from the Wikipedia article
# "Opinion polling for the <year> New Zealand general election" for every election from anchor_election on;
# add wikipedia_page: "<article title>" to an entry if its article has a different title.
elections:
  - {year: 2008, date: 2008-11-08, pm_party: Labour}
  - {year: 2011, date: 2011-11-26, pm_party: National}
  - {year: 2014, date: 2014-09-20, pm_party: National}
  - {year: 2017, date: 2017-09-23, pm_party: National}
  - {year: 2020, date: 2020-10-17, pm_party: Labour}
  - {year: 2023, date: 2023-10-14, pm_party: Labour}
  - {year: 2026, date: 2026-11-07, pm_party: National, forecast: true}

# Prime Minister's party at MMP elections before 2008, for the fundamentals prior (Ellis 2020).
# Party-vote results for these years are in data/reference/election_results.csv (1993 is FPP).
pm_history:
  - {year: 1996, pm_party: National}
  - {year: 1999, pm_party: National}
  - {year: 2002, pm_party: Labour}
  - {year: 2005, pm_party: Labour}

# First election used as the anchor of the latent state. Everything earlier is ignored.
anchor_election: 2011

# Weeks before each election treated as "campaign" (innovation variance scaled by kappa).
campaign_weeks: 8

# Parties with seats in Parliament at the start of each cycle. Always tracked in that cycle.
in_parliament:
  2014: [National, Labour, Green, NZ First, Te Pāti Māori, ACT, United Future, Mana]
  2017: [National, Labour, Green, NZ First, Te Pāti Māori, ACT, United Future]
  2020: [National, Labour, Green, NZ First, ACT]
  2023: [National, Labour, Green, ACT, Te Pāti Māori]
  2026: [National, Labour, Green, ACT, NZ First, Te Pāti Māori]

# Additional parties are tracked in a cycle when they exceed min_share in at least min_polls polls
# of that cycle (same rule as the 2023 NZ Herald model). Everything else is folded into "Other".
auto_track: {min_share: 0.025, min_polls: 4}

# Seats at dissolution (documentation only; not used by the model).
parliament_2026:
  National: 49
  Labour: 34
  Green: 15
  ACT: 11
  NZ First: 8
  Te Pāti Māori: 4
  Independent: 2

# Chart colours. Each keeps the party's usual hue family, re-stepped so every pair stays distinguishable in one
# chart, including for colour-blind readers: validated with the dataviz palette checker (OKLab colour difference
# of at least 15 for normal vision and 10 under protanopia and deuteranopia, all pairs). NZ First's black and
# Other's grey are deliberate neutrals. Check any change with the same validator before using it.
colours:
  National: "#1F5FBF"
  Labour: "#D8342A"
  Green: "#44CA89"
  ACT: "#D9A300"
  NZ First: "#1F2328"
  Te Pāti Māori: "#8E2F6B"
  TOP: "#079EC4"
  New Conservative: "#00AEEF"
  Other: "#CDD1D5"
